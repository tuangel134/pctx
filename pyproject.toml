[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pctx"
description = "Portable, evidence-backed project context compiler for AI tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PCTX contributors" }]
keywords = ["ai", "llm", "context", "mcp", "memory", "developer-tools", "project-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/tuangel134/pctx"
Repository = "https://github.com/tuangel134/pctx"
Issues = "https://github.com/tuangel134/pctx/issues"
Changelog = "https://github.com/tuangel134/pctx/blob/main/CHANGELOG.md"

[project.scripts]
pctx = "pctx.cli:main"

[tool.setuptools]
packages = ["pctx"]

[tool.setuptools.package-data]
pctx = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
semantic = ["numpy>=1.26", "onnxruntime>=1.18", "tokenizers>=0.20"]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.dynamic]
version = { attr = "pctx.__version__" }
